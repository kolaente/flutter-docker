name: Build Image

on:
  push:
    branches: ["main"]
    paths:
      - Dockerfile
      - FLUTTER_VERSION
      - smoke-test.sh
      - .github/workflows/**
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build. The caller's github.sha predates the version bump it just pushed.
        type: string
        required: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Compute tags
        id: meta
        run: |
          version=$(cat FLUTTER_VERSION)
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "tags<<EOF"
            echo "$IMAGE:$version"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-$(git rev-parse --short HEAD)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # No build cache on purpose, the weekly rebuild should pick up base image and apt updates
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          build-args: FLUTTER_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Smoke test
        run: docker run --rm -v "$PWD/smoke-test.sh:/smoke-test.sh:ro" "$IMAGE:${{ steps.meta.outputs.version }}" /smoke-test.sh

      - name: Log into GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"
