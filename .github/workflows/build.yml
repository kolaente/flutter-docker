name: Build Image

on:
  push:
    branches: ["main"]
    paths: &image-paths
      - Dockerfile
      - FLUTTER_VERSION
      - android-sdk-packages
      - smoke-test.sh
      - .github/workflows/**
  pull_request:
    branches: ["main"]
    paths: *image-paths
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build. The caller's github.sha predates the version bump it just pushed.
        type: string
        required: true

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Both targets build in one builder so the android image reuses the slim layers, in the registry too
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing
      id-token: write
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # The loaded images plus BuildKit's copy of them outgrow the runner disk
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Read version
        id: version
        run: |
          {
            echo "flutter=$(cat FLUTTER_VERSION)"
            echo "revision=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha and revision come from the checkout, github.sha is stale when called by the updater
      - name: Extract Docker metadata for slim
        id: meta-slim
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.flutter }},suffix=-slim
            type=raw,value=slim,enable={{is_default_branch}}
            type=raw,value=sha-${{ steps.version.outputs.short_sha }},suffix=-slim
            type=ref,event=pr,suffix=-slim
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
            org.opencontainers.image.version=${{ steps.version.outputs.flutter }}-slim

      - name: Extract Docker metadata for android
        id: meta-android
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.flutter }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ steps.version.outputs.short_sha }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
            org.opencontainers.image.version=${{ steps.version.outputs.flutter }}

      # Scheduled builds skip the cache to pick up base image and apt updates
      - name: Build slim image
        id: build-slim
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: slim
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          build-args: FLUTTER_VERSION=${{ steps.version.outputs.flutter }}
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          cache-from: type=gha,scope=slim

      - name: Build android image
        id: build-android
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: android
          platforms: linux/amd64
          load: true
          build-args: FLUTTER_VERSION=${{ steps.version.outputs.flutter }}
          tags: ${{ steps.meta-android.outputs.tags }}
          labels: ${{ steps.meta-android.outputs.labels }}
          cache-from: |
            type=gha,scope=slim
            type=gha,scope=android

      - name: Smoke test
        env:
          SLIM_IMAGE_ID: ${{ steps.build-slim.outputs.imageid }}
          ANDROID_IMAGE_ID: ${{ steps.build-android.outputs.imageid }}
        run: |
          docker run --rm -v "$PWD/smoke-test.sh:/smoke-test.sh:ro" "$SLIM_IMAGE_ID" /smoke-test.sh slim
          docker run --rm -v "$PWD/smoke-test.sh:/smoke-test.sh:ro" "$ANDROID_IMAGE_ID" /smoke-test.sh android

      # Every layer is still in the builder from the tested builds, so these push that content
      - name: Push slim image
        id: push-slim
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: slim
          platforms: linux/amd64
          push: true
          build-args: FLUTTER_VERSION=${{ steps.version.outputs.flutter }}
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          cache-from: type=gha,scope=slim
          cache-to: type=gha,scope=slim,mode=max

      - name: Push android image
        id: push-android
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: android
          platforms: linux/amd64
          push: true
          build-args: FLUTTER_VERSION=${{ steps.version.outputs.flutter }}
          tags: ${{ steps.meta-android.outputs.tags }}
          labels: ${{ steps.meta-android.outputs.labels }}
          cache-from: |
            type=gha,scope=slim
            type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max

      - name: Sign the published Docker images
        if: github.ref == 'refs/heads/main'
        env:
          SLIM_TAGS: ${{ steps.meta-slim.outputs.tags }}
          SLIM_DIGEST: ${{ steps.push-slim.outputs.digest }}
          ANDROID_TAGS: ${{ steps.meta-android.outputs.tags }}
          ANDROID_DIGEST: ${{ steps.push-android.outputs.digest }}
        run: |
          echo "${SLIM_TAGS}" | xargs -I {} cosign sign --yes "{}@${SLIM_DIGEST}"
          echo "${ANDROID_TAGS}" | xargs -I {} cosign sign --yes "{}@${ANDROID_DIGEST}"
